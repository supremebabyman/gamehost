  - type: web
    name: gamehost
    runtime: static
    buildCommand: npm install
    staticPublishPath: ./build
    previews:
      generation: automatic
    buildFilter:
      paths:
        - src/**/*.js
      ignoredPaths:
        - src/**/*.test.js
    headers:
      - path: /*
        name: X-Frame-Options
        value: sameorigin
    routes:
      - type: redirect
        source: /old
        destination: /new
      - type: rewrite
        source: /a/*
        destination: /a